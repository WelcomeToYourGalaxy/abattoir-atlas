name: 3 · Parse and deduplicate

# Reads everything in raw/, clusters it, writes the review queue and the report.
# Cheap — run it as often as you like.

on:
  workflow_dispatch:
  push:
    paths: ['raw/**']

permissions:
  contents: write

concurrency:
  group: atlas-commit
  cancel-in-progress: false

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      # Prints exactly what the build will read. If a source is missing from
      # the map, it is missing from this listing first.
      - name: What is in raw/
        continue-on-error: true
        run: |
          echo "--- raw/ ---"
          find raw -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || ls -la raw/
          for f in raw/*.jsonl raw/*.json raw/*.csv; do
            if [ -f "$f" ]; then echo "$f: $(wc -l < "$f") lines"; fi
          done
          echo "--- subdirs ---"
          for d in raw/*/; do
            if [ -d "$d" ]; then echo "$d: $(ls -1 "$d" | wc -l) files"; fi
          done
          # A bare [ -d ] test as the last command returns non-zero when the
          # glob does not expand, and under `bash -e` that fails the job. This
          # step is diagnostics; it must never be what stops a build.
          echo "--- end of listing ---"

      - name: Parse every source present in raw/
        run: bash parse_all.sh

      - name: Cluster
        run: python run.py dedup

      - run: python run.py status

      - name: Commit dataset
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add -f out/facilities.json.gz out/review_queue.csv out/dedup_report.md
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "dataset: rebuild $(date -u +%Y-%m-%d)"
          # Another workflow may have pushed while this one ran. Rebase onto
          # whatever landed and retry rather than failing the whole build.
          push() {
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
                return 0
              fi
              echo "push race; retry $i"
              sleep $((i * 5))
            done
            return 1
          }
          push

      - uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: |
            out/facilities.json.gz
            out/review_queue.csv
            out/dedup_report.md
          retention-days: 90
