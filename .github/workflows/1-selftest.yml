name: 1 · Self test

# Runs on every push. Proves the matcher and the renderer still work before you
# spend hours of geocoding on top of them.

on:
  push:
    paths: ['*.py', '.github/workflows/1-selftest.yml']
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python run.py selftest
      - uses: actions/upload-artifact@v4
        with:
          name: smoketest-map
          path: out/smoketest_synthetic.html
