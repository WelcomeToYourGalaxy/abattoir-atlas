name: 5 · Build and publish

# Re-clusters with the geocode cache live (which is what turns on the proximity
# match tier), builds the map, and publishes it to GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Map title'
        default: 'Where animals are killed'
  workflow_run:
    workflows: ['4 · Geocode']
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      # Prints exactly what the build will read. If a source is missing from
      # the map, it is missing from this listing first.
      - name: What is in raw/
        run: |
          echo "--- raw/ ---"
          find raw -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || ls -la raw/
          for f in raw/*.jsonl raw/*.json raw/*.csv; do
            [ -f "$f" ] && echo "$f: $(wc -l < "$f") lines"
          done
          echo "--- subdirs ---"
          for d in raw/*/; do [ -d "$d" ] && echo "$d: $(ls -1 "$d" | wc -l) files"; done

      - run: bash parse_all.sh

      - name: Cluster with coordinates live
        run: python run.py dedup

      - name: Build the map
        run: |
          python run.py build \
            --out atlas.html \
            --title "${{ inputs.title || 'Where animals are killed' }}"
          mkdir -p docs
          cp out/atlas.html docs/index.html
          cp out/dedup_report.md docs/dedup_report.md
          ls -lh docs/

      - run: python run.py status

      - name: Commit outputs
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add -f docs/ out/facilities.json.gz out/review_queue.csv out/dedup_report.md
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "atlas: build $(date -u +%Y-%m-%d)"
          # Another workflow may have pushed while this one ran. Rebase onto
          # whatever landed and retry rather than failing the whole build.
          push() {
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
                return 0
              fi
              echo "push race; retry $i"
              sleep $((i * 5))
            done
            return 1
          }
          push

      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
