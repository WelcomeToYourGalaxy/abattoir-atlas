name: 4 · Geocode

# Geocoding runs over concurrent provider lanes: four on Photon, which serves
# the same OpenStreetMap data with no per-second rule, and one on Nominatim at
# its documented one per second. Anything Photon cannot place is retried on
# Nominatim before being recorded as unresolvable, so the speed costs nothing
# in coverage or precision.
#
# That is roughly ten times the old rate — tens of thousands of addresses in a
# single run rather than days of cron cycles. It still chunks and resumes, and
# the cache is still the point: the work happens once, not once per rebuild.
#
# Set the CONTACT secret to a real email or URL. Both providers expect one and
# will throttle or block a User-Agent without it.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Fresh lookups this run'
        default: '40000'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: atlas-commit
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Rebuild records from raw/
        run: bash parse_all.sh

      - name: Stop early if nothing is outstanding
        id: check
        run: |
          python run.py status | tee status.txt
          if grep -qE 'geocode cache: .*, 0 outstanding' status.txt; then
            echo "done=true" >> $GITHUB_OUTPUT
            echo "Nothing left to geocode."
          fi

      - name: Geocode a slice
        if: steps.check.outputs.done != 'true'
        run: |
          python run.py geocode \
            --contact "${{ secrets.CONTACT }}" \
            --limit ${{ inputs.limit || 40000 }}

      - name: Commit the cache
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add -f work/geocache.json.gz
          git diff --staged --quiet && echo "no change" && exit 0
          n=$(python -c "import gzip,json;print(len(json.load(gzip.open('work/geocache.json.gz','rt'))))")
          git commit -m "geocode: $n addresses cached"
          # Another workflow may have pushed while this one ran. Rebase onto
          # whatever landed and retry rather than failing the whole build.
          push() {
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
                return 0
              fi
              echo "push race; retry $i"
              sleep $((i * 5))
            done
            return 1
          }
          push
